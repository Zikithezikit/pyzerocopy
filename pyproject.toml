[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyzerocopy"
version = "0.1.0"
description = "Zero-copy structured buffers for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yoav Haimov" }]
keywords = ["zero-copy", "binary", "struct", "buffer", "memoryview"]
classifiers = [
  "Typing :: Typed",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/Zikithezikit/pyzerocopy"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
bench = ["structed", "numpy"]

[tool.setuptools.package-data]
pyzerocopy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B018"]
"benchmarks/*" = ["E501", "B018", "E402"]
