[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyzerocopy"
version = "0.1.0"
description = "Zero-copy structured buffers for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yoav Haimov", email = "haimovyoav.work@gmail.com" }]
keywords = ["zero-copy", "binary", "struct", "buffer", "memoryview"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/Zikithezikit/pyzerocopy"
Documentation = "https://github.com/Zikithezikit/pyzerocopy#readme"
Issues = "https://github.com/Zikithezikit/pyzerocopy/issues"
Changelog = "https://github.com/Zikithezikit/pyzerocopy/blob/main/CHANGELOG.md"
PyPI = "https://pypi.org/project/pyzerocopy/"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "build", "twine"]
bench = ["structed", "numpy", "matplotlib"]

[tool.setuptools.package-data]
pyzerocopy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B018"]
"benchmarks/*" = ["E501", "B018", "E402"]

[tool.mypy]
files = ["src"]
strict = true
